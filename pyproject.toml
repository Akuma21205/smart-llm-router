[project]
name = "smart-llm-router"
version = "0.1.0"
description = "Semantic LLM routing system using Jev, deterministic policy matrix, NVIDIA NIM primary, OpenRouter fallback, and Apache ECharts telemetry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openrouter>=0.10.0",
    "pydantic>=2.10.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
    "typesafe-sdk>=0.7.1",
    "uvicorn>=0.30.0",
]
