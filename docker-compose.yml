services:
  smart-llm-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-llm-router
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - router-data:/app
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://smart-llm-router:8000/v1
      - OPENAI_API_KEY=sk-router-secret
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - smart-llm-router
    restart: unless-stopped

volumes:
  router-data:
  open-webui-data:
